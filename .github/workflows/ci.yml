name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Every commit of the PR follows Conventional Commits
        run: >-
          uvx --from commitizen==4.19.0 cz check
          --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}

  quality:
    name: Lint (pre-commit hooks = make lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: make install
      - run: make lint

  smoke-train:
    name: Train, export and serve (Python 3.11, TF 2.15)
    runs-on: ubuntu-latest
    env:
      TF_CPP_MIN_LOG_LEVEL: "3"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # All extras, like `make install`: doctests import every module (visualize needs [viz]).
      - run: make install
      - run: make test

  inference:
    # The base install must work without TensorFlow, on numpy 2.
    name: Inference helpers (Python 3.12, numpy 2, no TensorFlow)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12
      - run: uv pip install -e .
      - run: uv pip install pytest
      - run: uv pip list | grep -Ei "^(numpy|tensorflow) " || true
      - run: .venv/bin/pytest tests/test_inference.py
