[project]
name = "maskrcnn-matterport"
version = "0.2.0"
description = "Matterport Mask R-CNN (TF2 graph-mode port), packaged for TensorFlow 2.15 / Keras 2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# TensorFlow 2.15 is the last release with Keras 2 built in, which this code needs.
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow>=2.15,<2.16",
    "numpy>=1.23,<2",
    "scipy",
    "scikit-image>=0.19",
    "pillow",
    "h5py",
]

[project.optional-dependencies]
viz = ["matplotlib", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrcnn"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
