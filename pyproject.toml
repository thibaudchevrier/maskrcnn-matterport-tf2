[project]
name = "maskrcnn-matterport"
version = "0.3.1"
description = "Matterport Mask R-CNN (TF2 graph-mode port): training on TensorFlow 2.15, inference anywhere"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# Base install = inference helpers (mrcnn.inference): numpy 1.x or 2.x, no TensorFlow.
dependencies = [
    "numpy>=1.23",
    "scikit-image>=0.19",
]

[project.optional-dependencies]
# Training (mrcnn.model): TensorFlow 2.15, the last release with Keras 2 built in (Python < 3.12).
train = [
    "tensorflow>=2.15,<2.16; python_version < '3.12'",
    "numpy<2",
    "scipy",
    "pillow",
    "h5py",
]
# Running an exported model (mrcnn.serving): any TensorFlow 2.x that loads the SavedModel.
serve = ["tensorflow>=2.15"]
viz = ["matplotlib", "ipython"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mrcnn"]

[dependency-groups]
dev = [
    "pytest",
    "commitizen>=4.19",
    "pre-commit>=4",
    "ruff>=0.16.9",
    "pydoclint>=0.10.0",
    "pylint>=4.0.9",
]

[tool.pytest.ini_options]
# Docstring examples are tests too.
testpaths = ["mrcnn", "tests"]
addopts = "--doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, comprehensions, simplify, docstrings
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "D"]

[tool.ruff.lint.isort]
known-first-party = ["mrcnn"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

# Every parameter, return value and raised exception is documented (numpy style). The Matterport
# code predates type hints: types are documented in docstrings, not checked against annotations.
[tool.pydoclint]
style = "numpy"
exclude = '\.venv|tests'
skip-checking-short-docstrings = false
arg-type-hints-in-signature = false
arg-type-hints-in-docstring = true
check-return-types = false
check-yield-types = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "uv"          # bumps pyproject.toml and uv.lock together
tag_format = "v$version"
annotated_tag = true
update_changelog_on_bump = true
major_version_zero = true        # breaking changes bump the minor version while < 1.0

[tool.pylint.main]
py-version = "3.10"

[tool.pylint."messages control"]
# Exception to the shared standards, for the 2021 Matterport code only (see CLAUDE.md): its
# network-building functions and math-style names (N, P2, C5, the upper-case Config settings) are
# kept close to upstream instead of being restructured for pylint's naming and complexity limits.
# New code follows the shared standards and is reviewed for size and naming by hand.
disable = [
    "invalid-name",
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-statements",
    "too-many-branches",
    "too-many-lines",
    "too-many-instance-attributes",
    "too-few-public-methods",
    "fixme",               # upstream TODO notes, kept as documentation
    "duplicate-code",      # numpy and TensorFlow variants of the same box helpers
    "wrong-import-order",  # import order is ruff's job
    "ungrouped-imports",
]

[tool.pylint.format]
max-line-length = 100
